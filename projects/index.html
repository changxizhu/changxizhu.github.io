    <!-- ✨ Layout polish (no content changes) -->
    <style>
      :root {
        --card-radius: 1.25rem;
        --card-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
        --card-shadow-hover: 0 12px 36px rgba(0, 0, 0, 0.12);
        --ring: 0 0 0 3px rgba(59, 130, 246, 0.25);
      }

      /* Page header */
      .post-header {
        margin-bottom: 1.5rem;
        text-align: center;
      }
      .post-title {
        font-family: "Roboto Slab", ui-serif, Georgia, serif;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .post-description {
        color: rgba(0, 0, 0, 0.6);
        margin-top: 0.25rem;
      }
      [data-theme="dark"] .post-description {
        color: rgba(255, 255, 255, 0.65);
      }

      /* Section headings */
      .projects .category {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
        padding: 0.25rem 0;
        margin: 2rem 0 1rem;
        border-bottom: 2px solid rgba(0, 0, 0, 0.08);
      }
      [data-theme="dark"] .projects .category {
        border-bottom-color: rgba(255, 255, 255, 0.12);
      }
      .projects a#work,
      .projects a#fun {
        text-decoration: none !important;
      }

      /* Grid spacing */
      .projects .row {
        row-gap: 1.5rem;
      }

      /* Cards */
      .projects .card {
        border: 0 !important;
        border-radius: var(--card-radius);
        box-shadow: var(--card-shadow);
        transition: transform 180ms ease, box-shadow 180ms ease;
        overflow: hidden;
        background-clip: padding-box;
        height: 100%;
      }
      .projects .card:hover,
      .projects .card:focus-within {
        transform: translateY(-4px);
        box-shadow: var(--card-shadow-hover);
      }
      .projects .card:focus-within {
        outline: none;
      }

      /* Images: stable aspect & cover */
      .projects .card figure {
        margin: 0;
        overflow: hidden;
      }
      .projects .card-img-top {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        transform: translateZ(0);
        transition: transform 400ms ease;
        display: block;
      }
      .projects .card:hover .card-img-top {
        transform: scale(1.03);
      }

      /* Card body */
      .projects .card-body {
        padding: 1rem 1rem 1.1rem 1rem;
      }
      .projects .card-title {
        font-size: 1.05rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
        line-height: 1.25;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .projects .card-text {
        font-size: 0.95rem;
        color: rgba(0, 0, 0, 0.7);
        margin-bottom: 0.25rem;
      }
      [data-theme="dark"] .projects .card-text {
        color: rgba(255, 255, 255, 0.75);
      }

      /* Clickable card accessibility */
      .projects .col > a {
        display: block;
        border-radius: var(--card-radius);
        outline: none;
      }
      .projects .col > a:focus .card {
        box-shadow: var(--card-shadow-hover), var(--ring);
      }

      /* Navbar tweaks */
      #navbar .navbar-brand {
        letter-spacing: 0.1px;
      }
      #navbar .nav-link {
        padding: 0.4rem 0.65rem;
      }

      /* Footer */
      footer.fixed-bottom .container {
        padding: 0.5rem 0.25rem;
        font-size: 0.9rem;
        opacity: 0.9;
        backdrop-filter: blur(6px);
      }

      /* Progress bar subtle style */
      #progress {
        height: 4px;
        background: transparent;
      }
      #progress::-webkit-progress-value {
        background: linear-gradient(90deg, #60a5fa, #34d399);
      }
      #progress::-moz-progress-bar {
        background: linear-gradient(90deg, #60a5fa, #34d399);
      }

      /* Improve spacing on small screens */
      @media (max-width: 767.98px) {
        .post-header {
          margin-top: 0.25rem;
        }
        .projects .category {
          margin-top: 1.25rem;
        }
        .projects .card-body {
          padding: 0.9rem;
        }
      }
    </style>
